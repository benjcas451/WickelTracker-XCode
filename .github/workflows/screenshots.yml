name: Bildschirmfotos

# Fotos der wichtigsten Ansichten für Pull Requests: hell/dunkel, normale und
# große Schrift. Läuft im iOS-Simulator; die PNGs liegen als Artefakt
# „bildschirmfotos“ am Lauf. Nur Testdaten, keine echten Inhalte: die App
# startet im Modus „Lokal (SQLite)“ mit erfundenen Einträgen (Debug-Build,
# Argument -MhBildschirmfotos, siehe wickel/Bildschirmfotos.swift).
# Danach laufen die vorhandenen Unit- und UI-Tests im selben Simulator.
on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  fotos:
    name: Bildschirmfotos (iOS-Simulator)
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PROJEKT: wickel.xcodeproj
      SCHEMA: wickel
      UITESTS: wickelUITests
    steps:
      - uses: actions/checkout@v4

      - name: Simulator wählen
        run: |
          set -euo pipefail
          xcodebuild -version
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          geraete = json.load(sys.stdin)["devices"]
          def version(laufzeit):
              return [int(z) for z in re.findall(r"\d+", laufzeit.split("iOS-")[-1])]
          for laufzeit in sorted((l for l in geraete if "iOS-" in l), key=version, reverse=True):
              for geraet in geraete[laufzeit]:
                  if geraet["name"].startswith("iPhone") and "Pro" in geraet["name"] and "Max" not in geraet["name"]:
                      print(geraet["udid"]); print(geraet["name"], laufzeit, file=sys.stderr); sys.exit(0)
          for laufzeit in sorted((l for l in geraete if "iOS-" in l), key=version, reverse=True):
              for geraet in geraete[laufzeit]:
                  if geraet["name"].startswith("iPhone"):
                      print(geraet["udid"]); sys.exit(0)
          sys.exit("kein iPhone-Simulator gefunden")
          ')
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Simulator starten
        run: |
          xcrun simctl boot "$SIMULATOR" || true
          xcrun simctl bootstatus "$SIMULATOR" -b
          # Feste Uhrzeit in der Statusleiste, damit die Bilder ruhig aussehen.
          xcrun simctl status_bar "$SIMULATOR" override --time "9:41" --batteryState charged --batteryLevel 100 || true

      - name: Für Tests bauen
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project "$PROJEKT" -scheme "$SCHEMA" \
            -destination "id=$SIMULATOR" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO | tail -n 40

      - name: Fotografieren
        run: |
          set -o pipefail
          for modus in light dark; do
            for groesse in large accessibility-large; do
              xcrun simctl ui "$SIMULATOR" appearance "$modus"
              xcrun simctl ui "$SIMULATOR" content_size "$groesse"
              TEST_RUNNER_MH_VARIANTE="$modus-$groesse" xcodebuild test-without-building \
                -project "$PROJEKT" -scheme "$SCHEMA" -destination "id=$SIMULATOR" \
                -derivedDataPath build -only-testing:"$UITESTS/ScreenshotTests" \
                -parallel-testing-enabled NO \
                -resultBundlePath "fotos-$modus-$groesse.xcresult" | tail -n 20 || true
            done
          done

      - name: Fotos auspacken
        run: |
          mkdir -p export
          for ergebnis in fotos-*.xcresult; do
            ziel="export/${ergebnis%.xcresult}"
            mkdir -p "$ziel"
            xcrun xcresulttool export attachments --path "$ergebnis" --output-path "$ziel" || true
          done
          find export -type f | head -100

      - uses: actions/upload-artifact@v4
        with:
          name: bildschirmfotos
          path: export
          if-no-files-found: warn

      - name: Vorhandene Tests
        run: |
          set -o pipefail
          xcrun simctl ui "$SIMULATOR" appearance light
          xcrun simctl ui "$SIMULATOR" content_size large
          xcodebuild test-without-building \
            -project "$PROJEKT" -scheme "$SCHEMA" -destination "id=$SIMULATOR" \
            -derivedDataPath build \
            -skip-testing:"$UITESTS/ScreenshotTests" \
            -parallel-testing-enabled NO \
            -resultBundlePath tests.xcresult | tail -n 40
